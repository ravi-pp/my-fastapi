 <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
  <a class="navbar-brand" href="#">TodoAPP</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav">
      <li class="nav-item active">
        <a class="nav-link" href="/">Home <span class="sr-only">(current)</span></a>
      </li>
      {% if user %}
      <li class="nav-item">
        <a class="nav-link disabled" href="#">{{user.username}}</a>
      </li>
      {% else %}
      <li class="nav-item">
        <a class="nav-link" href="/auth/login-page">Login</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" href="/auth/register-page">Register</a>
      </li>
      {% endif %}
    </ul>
     {% if user %}
    <button class="btn btn-primary btn-sm" onclick="logout()">logout</button>
    {% endif %}
  </div>
</nav>
